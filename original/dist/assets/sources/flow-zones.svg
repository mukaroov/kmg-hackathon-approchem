<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img"><title>Модель ПССС</title><rect x="0" y="0" width="700" height="310" rx="18" fill="#ecf2ec"/><text x="30" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15372f" text-anchor="start">Модель ПССС</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#395a51" text-anchor="start">Положение границы меняется со временем. Давление задаётся отдельно для каждой области.</text><rect x="30.0" y="103" width="314.0" height="174" rx="12" fill="#d9e7dd"/><text x="45.0" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Возмущённая область</text><text x="45.0" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Начинается у стенки скважины.</text><text x="45.0" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Профиль условно стационарен.</text><rect x="356.0" y="103" width="314.0" height="174" rx="12" fill="#d9e7dd"/><text x="371.0" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Невозмущённая область</text><text x="371.0" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Давление равно начальному</text><text x="371.0" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">контурному.</text></svg>