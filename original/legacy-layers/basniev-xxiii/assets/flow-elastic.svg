<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img"><title>Как вовлекается пласт</title><rect x="0" y="0" width="700" height="310" rx="18" fill="#ecf2ec"/><text x="30" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15372f" text-anchor="start">Как вовлекается пласт</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#395a51" text-anchor="start">Последовательность при пуске скважины в условиях упругого режима.</text><rect x="30.0" y="103" width="205.33333333333334" height="174" rx="12" fill="#d9e7dd"/><text x="45.0" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Пуск скважины</text><text x="45.0" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Изменяются</text><text x="45.0" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">условия отбора.</text><rect x="247.33333333333334" y="103" width="205.33333333333334" height="174" rx="12" fill="#d9e7dd"/><text x="262.33333333333337" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Сначала</text><text x="262.33333333333337" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Движение вблизи</text><text x="262.33333333333337" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">забоя скважины.</text><rect x="464.6666666666667" y="103" width="205.33333333333334" height="174" rx="12" fill="#d9e7dd"/><text x="479.6666666666667" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Затем</text><text x="479.6666666666667" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Вовлекаются</text><text x="479.6666666666667" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">более удалённые</text><text x="479.6666666666667" y="236" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">области пласта.</text></svg>