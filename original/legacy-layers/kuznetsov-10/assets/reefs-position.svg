<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img"><title>Два положения в бассейне</title><rect x="0" y="0" width="700" height="310" rx="18" fill="#ecf2ec"/><text x="30" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15372f" text-anchor="start">Два положения в бассейне</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#395a51" text-anchor="start">Положение и геометрия помогают различить рифовые постройки.</text><rect x="30.0" y="103" width="314.0" height="174" rx="12" fill="#d9e7dd"/><text x="45.0" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Одиночный риф</text><text x="45.0" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Локальное поднятие дна.</text><text x="45.0" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Поперечное сечение</text><text x="45.0" y="236" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">примерно симметрично.</text><rect x="356.0" y="103" width="314.0" height="174" rx="12" fill="#d9e7dd"/><text x="371.0" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Асимметричная система</text><text x="371.0" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Цепочка на перегибе дна.</text><text x="371.0" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">По сторонам — мелководная</text><text x="371.0" y="236" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">и глубоководная области.</text></svg>