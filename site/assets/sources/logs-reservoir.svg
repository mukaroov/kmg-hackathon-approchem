<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img"><title>Почему диаметр уменьшается</title><rect x="0" y="0" width="700" height="310" rx="18" fill="#ecf2ec"/><text x="30" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15372f" text-anchor="start">Почему диаметр уменьшается</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#395a51" text-anchor="start">Схема стенки скважины при образовании глинистой корки · без масштаба.</text><rect x="150" y="108" width="34" height="135" rx="0" fill="#97b8a4"/><rect x="186" y="108" width="108" height="135" rx="0" fill="#d0e1d8"/><rect x="296" y="108" width="34" height="135" rx="0" fill="#97b8a4"/><path d="M 150 107 V 243 M 330 107 V 243" stroke="#508579" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 184 164 H 296 M 184 164 l 7 -5 M 184 164 l 7 5 M 296 164 l -7 -5 M 296 164 l -7 5" stroke="#508579" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="275" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#15372f" text-anchor="start">Стенка и глинистая корка</text><text x="367" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#15372f" text-anchor="start">Корка занимает часть просвета.</text><text x="367" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#15372f" text-anchor="start">Измеренный диаметр</text><text x="367" y="209" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#15372f" text-anchor="start">скважины уменьшается.</text></svg>