<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img"><title>От измерений к выводу</title><rect x="0" y="0" width="700" height="310" rx="18" fill="#ecf2ec"/><text x="30" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#15372f" text-anchor="start">От измерений к выводу</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#395a51" text-anchor="start">Три входа для оценки характера насыщения в рассматриваемом комплексе.</text><rect x="30.0" y="103" width="205.33333333333334" height="174" rx="12" fill="#d9e7dd"/><text x="45.0" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Сопротивление</text><text x="45.0" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Удельное</text><text x="45.0" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">сопротивление</text><text x="45.0" y="236" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">пласта</text><rect x="247.33333333333334" y="103" width="205.33333333333334" height="174" rx="12" fill="#d9e7dd"/><text x="262.33333333333337" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15372f" text-anchor="start">Пористость</text><text x="262.33333333333337" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">Оценка объёма</text><text x="262.33333333333337" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">порового</text><text x="262.33333333333337" y="236" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#15372f" text-anchor="start">пространства</text><rect x="464.6666666666667" y="103" width="205.33333333333334" height="174" rx="12" fill="#d9e7dd"/><text x="479.